# Full-throughput 1v1 training preset (curriculum stage s1: movement and reliable contact).
# Every key is optional; omitted keys use the defaults in src/botcore/config.py. Unknown keys are errors.
# Validate without starting anything:  python -m botcore validate --config configs/default.toml

[run]
name = "s1"
seed = 1                      # training seeds must be < 1,000,000 (the evaluation seed range starts there)
device = "auto"               # cuda:0 when available
total_iterations = 100000     # effectively unbounded; stop with Ctrl+C or a STOP file, both checkpoint first
stage = "s1-contact"

[env]
team_size = 1
action_repeat = 8             # 120/8 = 15 decisions per second
rlbot_delay = true            # matches rlgym-rlbot StepOffset(-1, ACTION_END) in the RLBot runner
no_touch_timeout_seconds = 30.0
episode_timeout_seconds = 300.0

[env.scenario_weights]        # relative weights; kickoff must stay > 0 so ordinary play is represented
kickoff = 0.50
open_play = 0.20
shot = 0.08
save = 0.08
low_boost_defence = 0.04
recovery = 0.05
aerial = 0.05

[rewards]
team_spirit = 0.0             # irrelevant in 1v1

[rewards.weights]            # stage-1 weights: with goals at 10 the dense terms were drowned by early random
goal_scored = 3.0             # goals and nothing was learned in 5M steps; these learned contact in ~4M (STATUS.md).
goal_conceded = 3.0           # Raise goals back to 10 and shrink the shaping in stage 2 (docs/DESIGN.md).
ball_touch = 0.5
velocity_to_ball = 0.5
ball_to_goal = 1.5
boost_economy = 0.1

[model]
kind = "mlp"
actor_layers = [512, 512, 512]
critic_layers = [512, 512, 512]

[ppo]
gamma = 0.99                  # ~6.7 s horizon at 15 decisions/s
gae_lambda = 0.95
n_epochs = 2
batch_size = 24576            # one Adam step per batch: 3 batches x 2 epochs = 6 steps per iteration
n_minibatches = 1             # gradient accumulation only (memory), not extra optimiser steps
actor_lr = 3e-4              # rlgym-ppo and rlgym-learn-algos default; 1e-4 learned ~3x slower here (STATUS.md)
critic_lr = 3e-4
ent_coef = 0.01
clip_range = 0.2
max_grad_norm = 0.5
standardize_returns = true
reward_clip = 10.0

[collect]
n_workers = 12                # benchmarked on the Ryzen 5 8400F: 4->8.9k, 8->14.5k, 12->19.1k learner steps/s
envs_per_worker = 6
rollout_steps = 512           # 72 envs x 2 agents x 512 = 73,728 learner steps per iteration

[self_play]
frozen_opponent_fraction = 0.0   # start with pure current-policy self-play; see docs/DESIGN.md before raising
snapshot_every_iterations = 50

[checkpoint]
save_every_iterations = 20    # ~1.5M learner steps, roughly every 80 s
keep_last = 5

[eval]
n_seed_pairs = 16
match_seconds = 300.0
overtime_max_seconds = 120.0
deterministic = false
