# Necto-mix experiment NECTO arm (docs/EXPERIMENT_NECTO_MIX.md): the configuration that produced IL-12900, plus 10 of 77 envs vs frozen Necto V1 (11 workers x 7 envs keeps 144 learner slots = 73,728 learner steps/iteration).

[run]
name = "s5-necto"
seed = 202
device = "auto"
total_iterations = 13900
runs_dir = "runs"
stage = "s1-contact"

[env]
team_size = 1
action_repeat = 8
rlbot_delay = true
no_touch_timeout_seconds = 30.0
episode_timeout_seconds = 300.0

[env.scenario_weights]
kickoff = 0.5
open_play = 0.2
shot = 0.08
save = 0.08
low_boost_defence = 0.04
recovery = 0.05
aerial = 0.05

[rewards]
team_spirit = 0.0

[rewards.weights]
goal_scored = 3.0
goal_conceded = 3.0
ball_touch = 0.5
velocity_to_ball = 0.5
ball_to_goal = 1.5
boost_economy = 0.1

[model]
kind = "mlp"
actor_layers = [512, 512, 512]
critic_layers = [512, 512, 512]
embed_dim = 128
n_heads = 4
n_attention_layers = 2
head_layers = [256, 256]

[ppo]
gamma = 0.99
gae_lambda = 0.95
n_epochs = 2
batch_size = 24576
n_minibatches = 1
actor_lr = 0.0003
critic_lr = 0.0003
ent_coef = 0.01
clip_range = 0.2
max_grad_norm = 0.5
advantage_standardization = true
standardize_returns = true
reward_clip = 10.0

[collect]
n_workers = 11
envs_per_worker = 7
rollout_steps = 512

[self_play]
frozen_opponent_fraction = 0.0
necto_fraction = 0.13  # round(0.13 x 77) = 10 envs (about 15-16% of episodes), Necto side alternating orange/blue
snapshot_every_iterations = 40

[checkpoint]
save_every_iterations = 50
keep_last = 60

[eval]
n_seed_pairs = 16
match_seconds = 300.0
overtime_max_seconds = 120.0
deterministic = false

[imitation]
coef = 0.02
dataset = "runs/demos/s1.npz"
matches = [0, 1]  # m01, m02; m03 (index 2) is held out
batch_size = 2048
